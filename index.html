<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fuck Doomscrolling</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #000; --text: #e7e9ea; --muted: #71767b; --line: #2f3336; --hover: #080808; --raised: #16181c;
    --blue: #1d9bf0; --green: #00ba7c; --pink: #f91880;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 600px; margin: 0 auto; min-height: 100dvh; border-inline: 1px solid var(--line); }
  @media (max-width: 600px) { main { border-inline: 0; } }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  header {
    position: sticky; top: 0; z-index: 2; padding-top: env(safe-area-inset-top);
    background: rgba(0,0,0,.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 12px 16px 4px; font-weight: 800; font-size: 20px; }
  .brand img { width: 28px; height: 28px; }
  nav { display: flex; }
  nav button { flex: 1; padding: 16px 0 0; color: var(--muted); font-weight: 500; }
  nav button span { display: inline-block; padding-bottom: 14px; border-bottom: 4px solid transparent; }
  nav button[aria-selected="true"] { color: var(--text); font-weight: 700; }
  nav button[aria-selected="true"] span { border-color: var(--blue); }
  nav button:hover { background: rgba(231,233,234,.06); }

  article { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .avatar {
    flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 800; font-size: 15px; color: #fff;
  }
  .content { flex: 1; min-width: 0; }
  .meta { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta b { color: var(--text); }
  .pill { display: inline-block; margin: 4px 0 2px; padding: 0 8px; border-radius: 9999px; font-size: 13px; font-weight: 700; background: rgba(29,155,240,.15); color: var(--blue); }
  h2 { margin: 4px 0; font-size: 17px; line-height: 22px; font-weight: 700; }
  .body, .deeper, .answer { white-space: pre-line; overflow-wrap: break-word; }
  .deeper { margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; color: #d6d9db; }
  .section { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .reveal {
    margin-top: 12px; width: 100%; padding: 10px; border-radius: 9999px; font-weight: 700;
    background: var(--text); color: #0f1419;
  }
  .answer { margin-top: 12px; padding: 12px; border-radius: 16px; background: var(--raised); }
  .answer + .body { margin-top: 12px; color: var(--muted); }

  .actions { display: flex; justify-content: space-between; max-width: 425px; margin: 8px 0 -4px -8px; }
  .actions button {
    display: flex; align-items: center; gap: 4px; padding: 8px; border-radius: 9999px;
    color: var(--muted); font-size: 13px; min-height: 36px; transition: color .15s, background .15s;
  }
  .actions svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
  .actions .good.on svg, .actions .save.on svg { fill: currentColor; }
  .actions .again:hover, .actions .again.on { color: var(--green); }
  .actions .again:hover { background: rgba(0,186,124,.1); }
  .actions .good:hover, .actions .good.on { color: var(--pink); }
  .actions .good:hover { background: rgba(249,24,128,.1); }
  .actions .deep:hover, .actions .deep.on, .actions .save:hover, .actions .save.on { color: var(--blue); }
  .actions .deep:hover, .actions .save:hover { background: rgba(29,155,240,.1); }
  .actions .on svg { animation: pop .3s; }
  @keyframes pop { 50% { transform: scale(1.3); } }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .empty { padding: 40px 32px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--text); font-size: 24px; line-height: 28px; margin-bottom: 8px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
  .stats div { padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .stats b { display: block; color: var(--text); font-size: 22px; line-height: 28px; }
  .chapter { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .chapter .row { display: flex; justify-content: space-between; gap: 12px; }
  .chapter .row span { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .bar { height: 4px; margin-top: 8px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); }
  .bar i + i { margin-top: -4px; background: var(--green); }
  .sync { padding: 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .sync form { display: flex; gap: 8px; margin-top: 8px; }
  .sync input {
    flex: 1; min-width: 0; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit;
  }
  .sync input:focus { outline: none; border-color: var(--blue); }
  .sync button[type=submit], .sync .link { padding: 8px 16px; border-radius: 9999px; background: var(--blue); color: #fff; font-weight: 700; }
  .sync .link { background: none; color: var(--blue); padding: 0; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><img src="icon.svg" alt="">Fuck Doomscrolling</div>
    <nav role="tablist">
      <button role="tab" data-tab="feed" aria-selected="true"><span>For you</span></button>
      <button role="tab" data-tab="saved"><span>Saved</span></button>
      <button role="tab" data-tab="progress"><span>Progress</span></button>
    </nav>
  </header>
  <section id="view"></section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
